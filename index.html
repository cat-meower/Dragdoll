<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragdoll</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#fff;font-family:Arial,sans-serif}
.sphere{position:absolute;width:80px;height:80px;border-radius:50%;box-shadow:4px 6px 10px rgba(0,0,0,.2);z-index:2;will-change:left,top}
.red{background:radial-gradient(circle at 32% 28%,#ff7777 0%,#e00000 42%,#8b0000 100%)}
.orange{background:radial-gradient(circle at 32% 28%,#ffd08a 0%,#ff8c00 42%,#b84f00 100%)}
.yellow{background:radial-gradient(circle at 32% 28%,#fff477 0%,#ffd400 42%,#c99d00 100%)}
.green{background:radial-gradient(circle at 32% 28%,#8cff9a 0%,#22bb55 42%,#087a32 100%)}
.blue{background:radial-gradient(circle at 32% 28%,#77bbff 0%,#0066dd 42%,#003b80 100%)}
.indigo{background:radial-gradient(circle at 32% 28%,#aaa0ff 0%,#5146d8 42%,#28216f 100%)}
.pink{background:radial-gradient(circle at 32% 28%,#ffb0d0 0%,#ff66aa 42%,#b92d70 100%)}
.eye{position:absolute;top:24px;width:10px;height:13px;background:#111;border-radius:50%}
.eye.left{left:23px}.eye.right{right:23px}
.mouth{position:absolute;left:24px;width:32px;height:16px}
.smile-big{top:38px;border-bottom:6px solid #111;border-radius:50%}
.smile{top:41px;border-bottom:4px solid #111;border-radius:50%}
.smile-small{top:44px;border-bottom:3px solid #111;border-radius:50%}
.neutral{top:47px;height:4px;background:#111;border-radius:0}
.frown-small{top:47px;border-top:3px solid #111;border-radius:50%}
.frown{top:47px;border-top:4px solid #111;border-radius:50%}
.frown-deep{top:44px;border-top:6px solid #111;border-radius:50%}
#title-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#title{margin:0 0 22px;font-size:clamp(56px,10vw,110px);font-weight:900;letter-spacing:-5px;color:#111;text-shadow:0 5px 0 rgba(0,0,0,.08)}
#play{pointer-events:auto;border:0;border-radius:16px;padding:15px 58px;font-size:25px;font-weight:800;color:#fff;background:#25d34f;box-shadow:0 7px 0 #159b36,0 12px 28px rgba(37,211,79,.3);cursor:pointer;transition:transform .12s,box-shadow .12s}
#play:hover{transform:translateY(-2px);box-shadow:0 9px 0 #159b36,0 15px 32px rgba(37,211,79,.35)}
#play:active{transform:translateY(5px);box-shadow:0 2px 0 #159b36,0 5px 15px rgba(37,211,79,.25)}
</style>
</head>
<body>
<div id="balls"></div>
<div id="title-screen"><h1 id="title">Dragdoll</h1><button id="play">PLAY</button></div>
<script>
const ballsContainer=document.getElementById('balls');
const size=80,gap=10;
const ballTypes=['red','orange','yellow','green','blue','indigo','pink'];

function makeBall(type,index){
  const b=document.createElement('div');
  b.className=`sphere ${type}`;
  b.id=`${type}Sphere${index+1}`;
  const l=document.createElement('div');l.className='eye left';
  const r=document.createElement('div');r.className='eye right';
  const mouthClass={red:'smile-big',orange:'smile',yellow:'smile-small',green:'neutral',blue:'frown-small',indigo:'frown',pink:'frown-deep'}[type];
  const m=document.createElement('div');m.className=`mouth ${mouthClass}`;
  b.append(l,r,m);ballsContainer.appendChild(b);return b;
}
function randomPosition(pos){
  let x=0,y=0;
  for(let i=0;i<300;i++){
    x=Math.random()*Math.max(0,innerWidth-size);
    y=Math.random()*Math.max(0,innerHeight-size);
    if(pos.every(([a,c])=>Math.hypot(x-a,y-c)>=size+gap))return[x,y];
  }
  return[Math.max(0,Math.min(x,innerWidth-size)),Math.max(0,Math.min(y,innerHeight-size))];
}
function randomVelocity(){return{dx:(Math.random()<.5?-1:1)*(2.8+Math.random()*1.8),dy:(Math.random()<.5?-1:1)*(2.2+Math.random()*1.8)}}

const balls=[],used=[];
for(let i=0;i<ballTypes.length;i++){
  const type=ballTypes[i],element=makeBall(type,i),p=randomPosition(used),v=randomVelocity();
  used.push(p);balls.push({name:type,element,x:p[0],y:p[1],dx:v.dx,dy:v.dy});
}

const contactStates=new Map(),separationDelay=200;
function handleCollision(a,b){
  const cx=(b.x+size/2)-(a.x+size/2),cy=(b.y+size/2)-(a.y+size/2),d=Math.hypot(cx,cy),min=size;
  const key=[a.element.id,b.element.id].sort().join('-'),now=performance.now(),state=contactStates.get(key);
  if(d>=min||d===0){if(state&&state.touching){state.touching=false;state.separatedAt=now}return}
  if(!state)contactStates.set(key,{touching:true,separatedAt:0});
  const current=contactStates.get(key);
  if(current.touching&&current.separatedAt===0)return;
  if(current.separatedAt!==0&&now-current.separatedAt<separationDelay)return;
  const nx=cx/d,ny=cy/d,rv=(b.dx-a.dx)*nx+(b.dy-a.dy)*ny;
  if(rv>=0)return;
  const overlap=min-d;
  a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;
  const odx=a.dx,ody=a.dy;a.dx=b.dx;a.dy=b.dy;b.dx=odx;b.dy=ody;
  current.touching=true;current.separatedAt=0;
}

function move(){
  const maxX=Math.max(0,innerWidth-size),maxY=Math.max(0,innerHeight-size);
  for(const b of balls){
    b.x+=b.dx;b.y+=b.dy;
    if(b.x<=0||b.x>=maxX){b.x=Math.max(0,Math.min(b.x,maxX));b.dx*=-1}
    if(b.y<=0||b.y>=maxY){b.y=Math.max(0,Math.min(b.y,maxY));b.dy*=-1}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)handleCollision(balls[i],balls[j]);
  for(const b of balls){b.element.style.left=b.x+'px';b.element.style.top=b.y+'px'}
  requestAnimationFrame(move);
}

move();
</script>
</body>
</html>
