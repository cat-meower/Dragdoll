<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dragdoll</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;font-family:"Comic Sans MS","Comic Sans",cursive}.sphere{position:absolute;width:110px;height:110px;border-radius:50%;box-shadow:2px 3px 0 rgba(0,0,0,.18);z-index:2}.red{background:#e00000}.orange{background:#ff8c00}.yellow{background:#ffd400}.green{background:#22bb55}.blue{background:#0066dd}.indigo{background:#5146d8}.pink{background:#ff66aa}.eye{position:absolute;top:33px;width:13px;height:17px;background:#111;border-radius:50%}.eye.left{left:32px}.eye.right{right:32px}.mouth{position:absolute;left:37px;width:36px;height:20px}.smile-big{top:50px;border-bottom:8px solid #111;border-radius:0 0 50% 50%}.smile{top:54px;border-bottom:6px solid #111;border-radius:0 0 50% 50%}.smile-small{top:57px;border-bottom:5px solid #111;border-radius:0 0 50% 50%}#title-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none}#title{margin:0 0 22px;font-size:clamp(56px,10vw,110px);font-weight:900;letter-spacing:-5px;color:#25d34f;-webkit-text-stroke:6px #111;paint-order:stroke fill;text-shadow:0 8px 0 #159b36,0 12px 24px rgba(0,0,0,.22)}#play{pointer-events:auto;border:4px solid #111;border-radius:16px;padding:15px 58px;font-size:25px;font-weight:800;color:#fff;background:#25d34f;box-shadow:0 7px 0 #111,0 12px 28px rgba(37,211,79,.3);cursor:pointer}#game-screen{position:fixed;inset:0;background:#87ceeb;display:none;overflow:hidden}#game-screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:#65b84f;border-top:6px solid #4d943b;z-index:0}.wall{position:absolute;background:#7b7f86;border:5px solid #565a60;box-sizing:border-box;border-radius:3px;z-index:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}.wall.one{left:12%;top:18%;width:180px;height:28px}.wall.two{right:11%;top:34%;width:30px;height:190px}.wall.three{left:32%;bottom:130px;width:250px;height:30px}.prop{position:absolute;z-index:1}.crate{width:58px;height:58px;background:#a86b32;border:5px solid #6f451f;box-sizing:border-box;border-radius:4px;box-shadow:inset 0 0 0 3px rgba(255,205,120,.18)}.crate:before,.crate:after{content:"";position:absolute;left:8px;right:8px;top:24px;height:5px;background:#6f451f}.crate:after{transform:rotate(90deg)}.barrel{width:52px;height:64px;background:#9b6b3f;border:5px solid #674323;border-radius:12px;box-sizing:border-box}.barrel:before,.barrel:after{content:"";position:absolute;left:-2px;right:-2px;height:7px;background:#555;border:2px solid #333;border-radius:50%}.barrel:before{top:12px}.barrel:after{bottom:12px}.crate.a{left:23%;bottom:125px}.crate.b{right:25%;bottom:125px}.barrel.a{right:8%;bottom:125px}.barrel.b{left:8%;top:45%}.spike{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:40px solid #555;filter:drop-shadow(0 3px 0 #222)}.spike.a{left:48%;bottom:125px}.spike.b{left:53%;bottom:125px}.spike.c{left:58%;bottom:125px}#ragdoll{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;user-select:none;touch-action:none}.part{position:absolute;box-sizing:border-box}.head{width:36px;height:36px;background:#f4cc43;border:3px solid #b99316;border-radius:2px}.torso{width:45px;height:52px;background:#176baa;border:3px solid #124f7e}.limb{width:23px;height:45px;background:#f4cc43;border:3px solid #b99316;border-radius:2px;transform-origin:50% 0}.leg{width:23px;height:45px;background:#a5bc50;border:3px solid #718535;border-radius:2px;transform-origin:50% 0}.face-eye{width:5px;height:7px;background:#111;top:10px;border-radius:1px;position:absolute}.face-eye.left{left:8px}.face-eye.right{right:8px}.face-mouth{width:15px;height:6px;left:8px;top:21px;border-bottom:3px solid #111;border-radius:0 0 50% 50%;position:absolute}#game-screen.playing{display:block}</style></head><body><div id="balls"></div><div id="title-screen"><h1 id="title">Dragdoll</h1><button id="play">PLAY</button></div><div id="game-screen"><div class="wall one"></div><div class="wall two"></div><div class="wall three"></div><div class="prop crate a"></div><div class="prop crate b"></div><div class="prop barrel a"></div><div class="prop barrel b"></div><div class="prop spike a"></div><div class="prop spike b"></div><div class="prop spike c"></div><div id="ragdoll"><div class="part head" id="head"><div class="face-eye left"></div><div class="face-eye right"></div><div class="face-mouth"></div></div><div class="part torso" id="torso"></div><div class="part limb" id="armL"></div><div class="part limb" id="armR"></div><div class="part leg" id="legL"></div><div class="part leg" id="legR"></div></div></div><script>
const ballsContainer=document.getElementById('balls'),size=110,gap=10,ballTypes=['red','orange','yellow','green','blue','indigo','pink'];function makeBall(type,index){const b=document.createElement('div');b.className=`sphere ${type}`;const l=document.createElement('div');l.className='eye left';const r=document.createElement('div');r.className='eye right';const m=document.createElement('div');m.className=`mouth ${{red:'smile-big',orange:'smile',yellow:'smile-small',green:'smile',blue:'smile-small',indigo:'smile',pink:'smile-big'}[type]}`;b.append(l,r,m);ballsContainer.appendChild(b);return b}function randomPosition(pos){let x=0,y=0;for(let i=0;i<300;i++){x=Math.random()*Math.max(0,innerWidth-size);y=Math.random()*Math.max(0,innerHeight-size);if(pos.every(([a,c])=>Math.hypot(x-a,y-c)>=size+gap))return[x,y]}return[Math.max(0,Math.min(x,innerWidth-size)),Math.max(0,Math.min(y,innerHeight-size))]}function randomVelocity(){return{dx:(Math.random()<.5?-1:1)*(2.8+Math.random()*1.8),dy:(Math.random()<.5?-1:1)*(2.2+Math.random()*1.8)}}const balls=[],used=[];for(let i=0;i<ballTypes.length;i++){const type=ballTypes[i],element=makeBall(type,i),p=randomPosition(used),v=randomVelocity();used.push(p);balls.push({element,x:p[0],y:p[1],dx:v.dx,dy:v.dy})}function handleCollision(a,b){const cx=(b.x+size/2)-(a.x+size/2),cy=(b.y+size/2)-(a.y+size/2),d=Math.hypot(cx,cy);if(d===0||d>=size)return;const nx=cx/d,ny=cy/d,rv=(b.dx-a.dx)*nx+(b.dy-a.dy)*ny;if(rv>=0)return;const overlap=size-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;[a.dx,b.dx]=[b.dx,a.dx];[a.dy,b.dy]=[b.dy,a.dy]}function move(){const maxX=Math.max(0,innerWidth-size),maxY=Math.max(0,innerHeight-size);for(const b of balls){b.x+=b.dx;b.y+=b.dy;if(b.x<=0||b.x>=maxX){b.x=Math.max(0,Math.min(b.x,maxX));b.dx*=-1}if(b.y<=0||b.y>=maxY){b.y=Math.max(0,Math.min(b.y,maxY));b.dy*=-1}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)handleCollision(balls[i],balls[j]);for(const b of balls){b.element.style.left=b.x+'px';b.element.style.top=b.y+'px'}requestAnimationFrame(move)}move();
const play=document.getElementById('play'),titleScreen=document.getElementById('title-screen'),gameScreen=document.getElementById('game-screen');const clickSound=new Audio('clickgame.mp3');play.addEventListener('pointerup',()=>{clickSound.currentTime=0;clickSound.play().catch(()=>{});titleScreen.remove();ballsContainer.innerHTML='';gameScreen.classList.add('playing');initRagdoll()});const rag=document.getElementById('ragdoll'),parts={head:document.getElementById('head'),torso:document.getElementById('torso'),armL:document.getElementById('armL'),armR:document.getElementById('armR'),legL:document.getElementById('legL'),legR:document.getElementById('legR')};const TORSO_W=45,TORSO_H=52,LIMB_W=23,FLOOR_H=110,HEAD_W=36,HEAD_H=36;let points,grabbed=null,grabOffset={x:0,y:0},pointerVelocity={x:0,y:0},lastPointer={x:0,y:0,t:0};function initRagdoll(){const cx=innerWidth/2,top=110,tx=cx-TORSO_W/2,ty=top+40,shoulderY=ty+6,hipY=ty+TORSO_H;points={torso:{x:tx,y:ty,px:tx,py:ty},head:{x:tx+TORSO_W/2,y:ty-18,px:tx+TORSO_W/2,py:ty-18},armL:{x:tx-52,y:shoulderY,px:tx-52,py:shoulderY},armR:{x:tx+TORSO_W+52,y:shoulderY,px:tx+TORSO_W+52,py:shoulderY},legL:{x:tx+TORSO_W/4,y:hipY+45,px:tx+TORSO_W/4,py:hipY+45},legR:{x:tx+TORSO_W*3/4,y:hipY+45,px:tx+TORSO_W*3/4,py:hipY+45}};requestAnimationFrame(ragdollLoop)}function constrainAnchor(a,b,ax,ay,bx,by,len){const A=points[a],B=points[b];let x=(B.x+bx)-(A.x+ax),y=(B.y+by)-(A.y+ay),d=Math.hypot(x,y)||1;let correction=(d-len)/d*.10;correction=Math.max(-.18,Math.min(.18,correction));x*=correction;y*=correction;A.x+=x;A.y+=y;B.x-=x;B.y-=y;A.px+=x;A.py+=y;B.px-=x;B.py-=y}function stabilizeLeg(p,hipX,hipY){const dx=p.x-hipX,dy=p.y-hipY;if(dy<8){p.y=hipY+8;p.py=p.y}const maxLean=16,targetX=hipX+Math.max(-maxLean,Math.min(maxLean,dx)),correction=(targetX-p.x)*.20;p.x+=correction;p.px+=correction}function edgeBounce(p,w,h){const maxX=innerWidth-w,maxY=innerHeight-FLOOR_H-h;if(p.x<0){p.x=0;p.px=p.x+(p.x-p.px)*-.45}if(p.x>maxX){p.x=maxX;p.px=p.x+(p.x-p.px)*-.45}if(p.y<0){p.y=0;p.py=p.y+(p.y-p.py)*-.45}if(p.y>maxY){p.y=maxY;p.py=p.y+(p.y-p.py)*-.45}}function limbEdgeBounce(p){const floor=innerHeight-FLOOR_H;if(p.x<0){p.x=0;p.px=p.x+(p.x-p.px)*-.45}if(p.x>innerWidth){p.x=innerWidth;p.px=p.x+(p.x-p.px)*-.45}if(p.y<0){p.y=0;p.py=p.y+(p.y-p.py)*-.45}if(p.y>floor){p.y=floor;p.py=p.y+(p.y-p.py)*-.45}}function ragdollLoop(){const gravity=.04,damp=.985;for(const p of Object.values(points)){if(grabbed===p)continue;const vx=(p.x-p.px)*damp,vy=(p.y-p.py)*damp;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+gravity}if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y;grabbed.px=grabbed.x-pointerVelocity.x*1.2;grabbed.py=grabbed.y-pointerVelocity.y*1.2}for(let k=0;k<8;k++){constrainAnchor('torso','head',TORSO_W/2,0,0,0,18);constrainAnchor('torso','armL',0,6,0,0,52);constrainAnchor('torso','armR',TORSO_W,6,0,0,52);constrainAnchor('torso','legL',TORSO_W/4,TORSO_H,0,0,45);constrainAnchor('torso','legR',TORSO_W*3/4,TORSO_H,0,0,45);stabilizeLeg(points.legL,points.torso.x+TORSO_W/4,points.torso.y+TORSO_H);stabilizeLeg(points.legR,points.torso.x+TORSO_W*3/4,points.torso.y+TORSO_H);if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}}if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}edgeBounce(points.torso,TORSO_W,TORSO_H);limbEdgeBounce(points.armL);limbEdgeBounce(points.armR);limbEdgeBounce(points.legL);limbEdgeBounce(points.legR);if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}const T=points.torso,H=points.head;parts.torso.style.left=T.x+'px';parts.torso.style.top=T.y+'px';parts.head.style.left=H.x-HEAD_W/2+'px';parts.head.style.top=H.y-HEAD_H/2+'px';const shoulderL={x:T.x,y:T.y+6},shoulderR={x:T.x+TORSO_W,y:T.y+6},hipL={x:T.x+TORSO_W/4,y:T.y+TORSO_H},hipR={x:T.x+TORSO_W*3/4,y:T.y+TORSO_H},AL=points.armL,AR=points.armR,LL=points.legL,LR=points.legR;parts.armL.style.left=shoulderL.x-LIMB_W/2+'px';parts.armL.style.top=shoulderL.y+'px';parts.armL.style.transform=`rotate(${Math.atan2(AL.y-shoulderL.y,AL.x-shoulderL.x)-Math.PI/2}rad)`;parts.armR.style.left=shoulderR.x-LIMB_W/2+'px';parts.armR.style.top=shoulderR.y+'px';parts.armR.style.transform=`rotate(${Math.atan2(AR.y-shoulderR.y,AR.x-shoulderR.x)-Math.PI/2}rad)`;parts.legL.style.left=hipL.x-LIMB_W/2+'px';parts.legL.style.top=hipL.y+'px';parts.legL.style.transform=`rotate(${Math.atan2(LL.y-hipL.y,LL.x-hipL.x)-Math.PI/2}rad)`;parts.legR.style.left=hipR.x-LIMB_W/2+'px';parts.legR.style.top=hipR.y+'px';parts.legR.style.transform=`rotate(${Math.atan2(LR.y-hipR.y,LR.x-hipR.x)-Math.PI/2}rad)`;requestAnimationFrame(ragdollLoop)}function pointerPos(e){return{x:e.clientX,y:e.clientY}}rag.addEventListener('pointerdown',e=>{const q=pointerPos(e);let best=null,bd=60;for(const p of Object.values(points)){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best=p}}if(best){grabbed=best;grabOffset={x:q.x-best.x,y:q.y-best.y};pointerVelocity={x:0,y:0};lastPointer={x:q.x,y:q.y,t:performance.now()};rag.setPointerCapture(e.pointerId)}});rag.addEventListener('pointermove',e=>{if(!grabbed)return;const q=pointerPos(e),now=performance.now(),dt=Math.max(8,now-lastPointer.t);pointerVelocity.x=(q.x-lastPointer.x)/(dt/16.67);pointerVelocity.y=(q.y-lastPointer.y)/(dt/16.67);pointerVelocity.x=Math.max(-35,Math.min(35,pointerVelocity.x));pointerVelocity.y=Math.max(-35,Math.min(35,pointerVelocity.y));lastPointer={x:q.x,y:q.y,t:now}});function releaseRagdoll(){if(!grabbed)return;grabbed.px=grabbed.x-pointerVelocity.x*1.2;grabbed.py=grabbed.y-pointerVelocity.y*1.2;grabbed=null;pointerVelocity={x:0,y:0}}rag.addEventListener('pointerup',releaseRagdoll);rag.addEventListener('pointercancel',releaseRagdoll);window.addEventListener('resize',()=>{if(!points)return;for(const p of Object.values(points)){p.x=Math.max(0,Math.min(p.x,innerWidth));p.y=Math.max(0,Math.min(p.y,innerHeight-FLOOR_H))}});
</script></body></html>
