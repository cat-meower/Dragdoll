<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red, Blue and Yellow Balls</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: white; }
    .sphere { position: absolute; width: 80px; height: 80px; border-radius: 50%; box-shadow: 4px 6px 10px rgba(0,0,0,.2); z-index: 2; }
    .red { background: radial-gradient(circle at 32% 28%, #ff7777 0%, #e00000 42%, #8b0000 100%); }
    .blue { background: radial-gradient(circle at 32% 28%, #77bbff 0%, #0066dd 42%, #003b80 100%); }
    .yellow { background: radial-gradient(circle at 32% 28%, #fff477 0%, #ffd400 42%, #c99d00 100%); }
    .eye { position: absolute; top: 24px; width: 10px; height: 13px; background: #111; border-radius: 50%; }
    .eye.left { left: 23px; } .eye.right { right: 23px; }
    .mouth { position: absolute; left: 24px; width: 32px; height: 16px; }
    .smile { top: 41px; border-bottom: 4px solid #111; border-radius: 50%; }
    .frown { top: 47px; border-top: 4px solid #111; border-radius: 50%; }
    .straight { top: 47px; height: 4px; background: #111; border-radius: 0; }
    .confetti { position: fixed; width: 6px; height: 9px; pointer-events: none; z-index: 1; animation: confetti-fly 700ms ease-out forwards; }
    .mammott-pop { position: fixed; width: 70px; height: 70px; object-fit: contain; pointer-events: none; z-index: 1; opacity: 0; animation: mammott-fade 750ms ease-out forwards; transform: translate(-50%,-50%); }
    .collision-explosion { position: fixed; width: 28px; height: 28px; border-radius: 50%; pointer-events: none; z-index: 3; transform: translate(-50%,-50%) scale(.2); background: radial-gradient(circle, #fff 0%, var(--light) 20%, var(--main) 55%, var(--dark) 78%, transparent 100%); box-shadow: 0 0 10px var(--main), 0 0 22px var(--main); animation: collision-explosion 450ms ease-out forwards; }
    @keyframes confetti-fly { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rotation)) scale(.7); opacity: 0; } }
    @keyframes mammott-fade { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.9); } 20% { opacity: .35; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.03); } }
    @keyframes collision-explosion { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(3.5); } }
  </style>
</head>
<body>
  <div id="balls"></div>
  <audio id="collisionSound" preload="auto"><source src="Mammott_Memory_Sample.mp3.mpeg" type="audio/mpeg"></audio>
  <script>
    const collisionSound = document.getElementById('collisionSound');
    const ballsContainer = document.getElementById('balls');
    const size = 80;
    const gap = 10;
    const collisionCooldown = 350;
    const ballTypes = Array(8).fill('red').concat(Array(8).fill('blue'), Array(8).fill('yellow'));

    let audioContext = null;
    let reversedBounceBuffer = null;
    let reversedBounceReady = false;

    async function prepareAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const response = await fetch('Mammott_Memory_Sample.mp3.mpeg');
        const arrayBuffer = await response.arrayBuffer();
        const originalBuffer = await audioContext.decodeAudioData(arrayBuffer);
        reversedBounceBuffer = audioContext.createBuffer(originalBuffer.numberOfChannels, originalBuffer.length, originalBuffer.sampleRate);
        for (let channel = 0; channel < originalBuffer.numberOfChannels; channel++) {
          const source = originalBuffer.getChannelData(channel);
          const target = reversedBounceBuffer.getChannelData(channel);
          for (let i = 0; i < source.length; i++) target[i] = source[source.length - 1 - i];
        }
        reversedBounceReady = true;
      } catch (error) { reversedBounceReady = false; }
    }
    prepareAudio();

    function makeBall(type, index) {
      const ball = document.createElement('div');
      ball.className = `sphere ${type}`;
      ball.id = `${type}Sphere${index + 1}`;
      ball.setAttribute('aria-label', `${type} sphere`);
      const eyeLeft = document.createElement('div'); eyeLeft.className = 'eye left';
      const eyeRight = document.createElement('div'); eyeRight.className = 'eye right';
      const mouth = document.createElement('div'); mouth.className = `mouth ${type === 'red' ? 'smile' : type === 'blue' ? 'frown' : 'straight'}`;
      ball.append(eyeLeft, eyeRight, mouth);
      ballsContainer.appendChild(ball);
      return ball;
    }

    function playNormalBounceSound() {
      collisionSound.currentTime = 0;
      collisionSound.playbackRate = 1;
      collisionSound.volume = 1;
      collisionSound.play().catch(() => {});
    }

    function playReversedBounceSound() {
      if (!reversedBounceReady || !audioContext) return;
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      const source = audioContext.createBufferSource();
      const gain = audioContext.createGain();
      source.buffer = reversedBounceBuffer;
      gain.gain.value = .8;
      source.connect(gain); gain.connect(audioContext.destination); source.start();
    }

    function playYellowSound() {
      if (!reversedBounceReady || !audioContext) return;
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      const source = audioContext.createBufferSource();
      const gain = audioContext.createGain();
      source.buffer = reversedBounceBuffer;
      source.playbackRate.value = 1.28;
      gain.gain.value = .8;
      source.connect(gain); gain.connect(audioContext.destination); source.start();
    }

    function randomPosition(existingPositions) {
      let px = 0, py = 0;
      for (let i = 0; i < 300; i++) {
        px = Math.random() * Math.max(0, window.innerWidth - size);
        py = Math.random() * Math.max(0, window.innerHeight - size);
        if (existingPositions.every(([x,y]) => Math.hypot(px-x, py-y) >= size + gap)) return [px,py];
      }
      return [Math.max(0, Math.min(px, window.innerWidth-size)), Math.max(0, Math.min(py, window.innerHeight-size))];
    }

    function randomVelocity() { return { dx:(Math.random()<.5?-1:1)*(2.8+Math.random()*1.8), dy:(Math.random()<.5?-1:1)*(2.2+Math.random()*1.8) }; }

    const balls = [];
    const usedPositions = [];
    for (let i = 0; i < ballTypes.length; i++) {
      const type = ballTypes[i];
      const element = makeBall(type, i);
      const [x,y] = randomPosition(usedPositions);
      usedPositions.push([x,y]);
      const velocity = randomVelocity();
      balls.push({ name:type, element, x, y, dx:velocity.dx, dy:velocity.dy });
      element.style.left=x+'px'; element.style.top=y+'px';
    }

    const lastCollisions = new Map();
    function playCollisionSound() {
      collisionSound.currentTime = 0;
      collisionSound.playbackRate = .72;
      collisionSound.volume = 1;
      collisionSound.play().catch(() => {});
    }
    function mammottBurst(edgeX,edgeY) {
      const mammott = document.createElement('img'); mammott.className='mammott-pop'; mammott.src='mammot.jpg'; mammott.alt=''; mammott.style.left=edgeX+'px'; mammott.style.top=edgeY+'px'; document.body.appendChild(mammott); setTimeout(()=>mammott.remove(),800);
    }
    function confettiBurst(edgeX,edgeY,directionX,directionY) {
      const colors=['#ff0000','#00aaff','#ffd400','#22bb55','#aa44ff','#ff66aa','#ff7a00','#00dddd'];
      for(let i=0;i<25;i++) {
        const piece=document.createElement('div'); piece.className='confetti'; piece.style.background=colors[Math.floor(Math.random()*colors.length)]; piece.style.left=edgeX+'px'; piece.style.top=edgeY+'px';
        const angle=Math.random()*Math.PI*2, distance=40+Math.random()*100; let finalX=Math.cos(angle)*distance, finalY=Math.sin(angle)*distance;
        if(directionX!==0) finalX=directionX*(30+Math.random()*90); if(directionY!==0) finalY=directionY*(30+Math.random()*90);
        piece.style.setProperty('--dx',finalX+'px'); piece.style.setProperty('--dy',finalY+'px'); piece.style.setProperty('--rotation',(Math.random()*720-360)+'deg'); document.body.appendChild(piece); setTimeout(()=>piece.remove(),750);
      }
    }
    function collisionExplosion(x,y,type) {
      const colors={orange:['#ffffff','#ff7a00','#b83b00'],green:['#ffffff','#22bb55','#087a32'],purple:['#ffffff','#8a2be2','#4b0082']};
      const [light,main,dark]=colors[type];
      const explosion=document.createElement('div'); explosion.className='collision-explosion'; explosion.style.setProperty('--light',light); explosion.style.setProperty('--main',main); explosion.style.setProperty('--dark',dark); explosion.style.left=x+'px'; explosion.style.top=y+'px'; document.body.appendChild(explosion); setTimeout(()=>explosion.remove(),500);
    }
    function edgeEffects(ball,dx,dy) {
      if(ball.name==='blue') playReversedBounceSound();
      else if(ball.name==='yellow') playYellowSound();
      else playNormalBounceSound();
      mammottBurst(ball.x+size/2,ball.y+size/2); confettiBurst(ball.x+size/2,ball.y+size/2,dx,dy);
    }
    function handleCollision(a,b) {
      const centerDX=(b.x+size/2)-(a.x+size/2), centerDY=(b.y+size/2)-(a.y+size/2), distance=Math.hypot(centerDX,centerDY), minDistance=size;
      if(distance>=minDistance || distance===0) return;
      const nx=centerDX/distance, ny=centerDY/distance, relativeVelocity=(b.dx-a.dx)*nx+(b.dy-a.dy)*ny, key=[a.element.id,b.element.id].sort().join('-'), now=performance.now();
      if(relativeVelocity>=0 || now-(lastCollisions.get(key)||0)<=collisionCooldown) return;
      const overlap=minDistance-distance, collisionX=(a.x+b.x+size)/2, collisionY=(a.y+b.y+size)/2;
      a.x-=nx*overlap/2; a.y-=ny*overlap/2; b.x+=nx*overlap/2; b.y+=ny*overlap/2;
      const oldDX=a.dx,oldDY=a.dy; a.dx=b.dx;a.dy=b.dy;b.dx=oldDX;b.dy=oldDY; lastCollisions.set(key,now);
      playCollisionSound();
      const type=[a.name,b.name].sort().join('-');
      if(type==='red-yellow') collisionExplosion(collisionX,collisionY,'orange');
      if(type==='blue-yellow') collisionExplosion(collisionX,collisionY,'green');
      if(type==='blue-red') collisionExplosion(collisionX,collisionY,'purple');
    }
    function move() {
      const maxX=Math.max(0,window.innerWidth-size), maxY=Math.max(0,window.innerHeight-size);
      for(const ball of balls) {
        ball.x+=ball.dx; ball.y+=ball.dy;
        if(ball.x<=0 || ball.x>=maxX) { ball.x=Math.max(0,Math.min(ball.x,maxX)); ball.dx*=-1; edgeEffects(ball,ball.dx>0?1:-1,0); }
        if(ball.y<=0 || ball.y>=maxY) { ball.y=Math.max(0,Math.min(ball.y,maxY)); ball.dy*=-1; edgeEffects(ball,0,ball.dy>0?1:-1); }
      }
      for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++) handleCollision(balls[i],balls[j]);
      for(const ball of balls) { ball.element.style.left=ball.x+'px'; ball.element.style.top=ball.y+'px'; }
      requestAnimationFrame(move);
    }
    move();
  </script>
</body>
</html>
