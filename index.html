<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow Balls</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:white;font-family:Arial,sans-serif}
.sphere{position:absolute;width:80px;height:80px;border-radius:50%;box-shadow:4px 6px 10px rgba(0,0,0,.2);z-index:2;will-change:transform}
.red{background:radial-gradient(circle at 32% 28%,#ff7777 0%,#e00000 42%,#8b0000 100%)}.orange{background:radial-gradient(circle at 32% 28%,#ffd08a 0%,#ff8c00 42%,#b84f00 100%)}.yellow{background:radial-gradient(circle at 32% 28%,#fff477 0%,#ffd400 42%,#c99d00 100%)}.green{background:radial-gradient(circle at 32% 28%,#8cff9a 0%,#22bb55 42%,#087a32 100%)}.blue{background:radial-gradient(circle at 32% 28%,#77bbff 0%,#0066dd 42%,#003b80 100%)}.indigo{background:radial-gradient(circle at 32% 28%,#aaa0ff 0%,#5146d8 42%,#28216f 100%)}.pink{background:radial-gradient(circle at 32% 28%,#ffb0d0 0%,#ff66aa 42%,#b92d70 100%)}
.eye{position:absolute;top:24px;width:10px;height:13px;background:#111;border-radius:50%}.eye.left{left:23px}.eye.right{right:23px}.mouth{position:absolute;left:24px;width:32px;height:16px}.smile-big{top:38px;border-bottom:6px solid #111;border-radius:50%}.smile{top:41px;border-bottom:4px solid #111;border-radius:50%}.smile-small{top:44px;border-bottom:3px solid #111;border-radius:50%}.neutral{top:47px;height:4px;background:#111;border-radius:0}.frown-small{top:47px;border-top:3px solid #111;border-radius:50%}.frown{top:47px;border-top:4px solid #111;border-radius:50%}.frown-deep{top:44px;border-top:6px solid #111;border-radius:50%}
.confetti{position:fixed;width:6px;height:9px;pointer-events:none;z-index:1;animation:confetti-fly 700ms ease-out forwards}.mammott-pop{position:fixed;width:70px;height:70px;object-fit:contain;pointer-events:none;z-index:1;opacity:0;animation:mammott-fade 750ms ease-out forwards;transform:translate(-50%,-50%)}
.collision-explosion{position:fixed;width:28px;height:28px;border-radius:50%;pointer-events:none;z-index:3;transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,#fff 0%,#ffcc66 20%,#ff8c00 55%,#a94d00 78%,transparent 100%);box-shadow:0 0 10px #ff8c00,0 0 22px #ff8c00;animation:collision-explosion 450ms ease-out forwards}
.speed-trail{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:1;opacity:.35;animation:trail-fade 350ms linear forwards}
#ui{position:fixed;top:12px;left:12px;z-index:10;background:rgba(255,255,255,.9);border:1px solid #ccc;border-radius:12px;padding:12px;width:220px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;user-select:none}#ui h2{margin:0 0 8px;font-size:18px}#stats{line-height:1.5;margin-bottom:8px}.control{margin:7px 0}.control label{display:flex;justify-content:space-between;margin-bottom:3px}input[type=range]{width:100%}button{border:0;border-radius:8px;padding:7px 9px;margin:2px;background:#222;color:white;cursor:pointer}button:hover{opacity:.85}.on{background:#16803c}.chaos{background:#9b24d6;font-weight:bold;width:100%;margin-top:7px}
@keyframes confetti-fly{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rotation)) scale(.7);opacity:0}}@keyframes mammott-fade{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}20%{opacity:.35;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}}@keyframes collision-explosion{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.5)}}@keyframes trail-fade{from{opacity:.35;transform:scale(1)}to{opacity:0;transform:scale(.15)}}
</style>
</head>
<body>
<div id="ui"><h2>🏀 Rainbow Physics</h2><div id="stats"></div>
<div class="control"><label>Speed <span id="speedValue">1.0x</span></label><input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></div>
<div class="control"><label>Bounciness <span id="bounceValue">1.0x</span></label><input id="bounce" type="range" min="0.5" max="1.4" step="0.1" value="1"></div>
<div class="control"><label>Volume <span id="volumeValue">100%</span></label><input id="volume" type="range" min="0" max="1" step="0.05" value="1"></div>
<button id="gravity">Gravity: OFF</button><button id="sound">Sound: ON</button><button id="trails">Trails: ON</button><button class="chaos" id="chaos">CHAOS MODE</button></div>
<div id="balls"></div><audio id="collisionSound" preload="auto"><source src="Mammott_Memory_Sample.mp3.mpeg" type="audio/mpeg"></audio>
<script>
const collisionSound=document.getElementById('collisionSound'),ballsContainer=document.getElementById('balls'),size=80,gap=10,collisionCooldown=350,ballTypes=['red','orange','yellow','green','blue','indigo','pink'];
let audioContext=null,reversedBounceBuffer=null,reversedBounceReady=false,gravity=false,soundOn=true,trailsOn=true,globalSpeed=1,bounciness=1,volume=1,collisions=0,wallBounces=0,startTime=performance.now(),chaos=false;
async function prepareAudio(){try{audioContext=new(window.AudioContext||window.webkitAudioContext)();const r=await fetch('Mammott_Memory_Sample.mp3.mpeg'),a=await r.arrayBuffer(),o=await audioContext.decodeAudioData(a);reversedBounceBuffer=audioContext.createBuffer(o.numberOfChannels,o.length,o.sampleRate);for(let c=0;c<o.numberOfChannels;c++){const s=o.getChannelData(c),t=reversedBounceBuffer.getChannelData(c);for(let i=0;i<s.length;i++)t[i]=s[s.length-1-i]}reversedBounceReady=true}catch(e){}}
prepareAudio();
function unlockAudio(){if(audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{});if(audioContext===null)prepareAudio()}document.addEventListener('pointerdown',unlockAudio,{once:true});
function makeBall(type,index){const b=document.createElement('div');b.className=`sphere ${type}`;b.id=`${type}Sphere${index+1}`;const l=document.createElement('div');l.className='eye left';const r=document.createElement('div');r.className='eye right';const mc={red:'smile-big',orange:'smile',yellow:'smile-small',green:'neutral',blue:'frown-small',indigo:'frown',pink:'frown-deep'}[type];const m=document.createElement('div');m.className=`mouth ${mc}`;b.append(l,r,m);ballsContainer.appendChild(b);return b}
function randomPosition(pos){let x=0,y=0;for(let i=0;i<300;i++){x=Math.random()*Math.max(0,innerWidth-size);y=Math.random()*Math.max(0,innerHeight-size);if(pos.every(([a,c])=>Math.hypot(x-a,y-c)>=size+gap))return[x,y]}return[Math.max(0,Math.min(x,innerWidth-size)),Math.max(0,Math.min(y,innerHeight-size))]}
function randomVelocity(){return{dx:(Math.random()<.5?-1:1)*(2.8+Math.random()*1.8),dy:(Math.random()<.5?-1:1)*(2.2+Math.random()*1.8)}}
const balls=[],used=[];for(let i=0;i<ballTypes.length;i++){const type=ballTypes[i],element=makeBall(type,i),p=randomPosition(used),v=randomVelocity();used.push(p);balls.push({name:type,element,x:p[0],y:p[1],dx:v.dx,dy:v.dy,baseDx:v.dx,baseDy:v.dy,rotation:0})}
const lastCollisions=new Map();
function playNormal(speed=1){if(!soundOn)return;collisionSound.currentTime=0;collisionSound.playbackRate=Math.max(.55,Math.min(2,speed));collisionSound.volume=volume;collisionSound.play().catch(()=>{})}
function playReversed(rate=1){if(!soundOn||!reversedBounceReady||!audioContext)return;if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});const s=audioContext.createBufferSource(),g=audioContext.createGain();s.buffer=reversedBounceBuffer;s.playbackRate.value=rate;g.gain.value=.8*volume;s.connect(g);g.connect(audioContext.destination);s.start()}
function mammottBurst(x,y){const m=document.createElement('img');m.className='mammott-pop';m.src='mammot.jpg';m.alt='';m.style.left=x+'px';m.style.top=y+'px';document.body.appendChild(m);setTimeout(()=>m.remove(),800)}
function confettiBurst(x,y,dx,dy,count=25){const colors=['#ff0000','#ff8c00','#ffd400','#22bb55','#0066dd','#5146d8','#ff66aa'];for(let i=0;i<count;i++){const p=document.createElement('div');p.className='confetti';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.left=x+'px';p.style.top=y+'px';const a=Math.random()*Math.PI*2,d=40+Math.random()*100;let fx=Math.cos(a)*d,fy=Math.sin(a)*d;if(dx)fx=dx*(30+Math.random()*90);if(dy)fy=dy*(30+Math.random()*90);p.style.setProperty('--dx',fx+'px');p.style.setProperty('--dy',fy+'px');p.style.setProperty('--rotation',(Math.random()*720-360)+'deg');document.body.appendChild(p);setTimeout(()=>p.remove(),750)}}
function explosion(x,y,scale=1){const e=document.createElement('div');e.className='collision-explosion';e.style.left=x+'px';e.style.top=y+'px';e.style.transform=`translate(-50%,-50%) scale(${.2*scale})`;document.body.appendChild(e);setTimeout(()=>e.remove(),500)}
function edgeEffects(b,dx,dy,speed){wallBounces++;const impact=Math.min(2,Math.abs(speed));if(b.name==='blue')playReversed(0.8+impact*.35);else if(b.name==='yellow')playReversed(1.05+impact*.3);else playNormal(.75+impact*.3);mammottBurst(b.x+size/2,b.y+size/2);confettiBurst(b.x+size/2,b.y+size/2,dx,dy,chaos?45:25);b.element.style.transform='scaleX(1.15) scaleY(.88)';setTimeout(()=>b.element.style.transform='',100)}
function handleCollision(a,b){const cx=(b.x+size/2)-(a.x+size/2),cy=(b.y+size/2)-(a.y+size/2),d=Math.hypot(cx,cy),min=size;if(d>=min||d===0)return;const nx=cx/d,ny=cy/d,rv=(b.dx-a.dx)*nx+(b.dy-a.dy)*ny,key=[a.element.id,b.element.id].sort().join('-'),now=performance.now();if(rv>=0||now-(lastCollisions.get(key)||0)<=collisionCooldown)return;const overlap=min-d,x=(a.x+b.x+size)/2,y=(a.y+b.y+size)/2;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;const odx=a.dx,ody=a.dy;a.dx=b.dx*bounciness;a.dy=b.dy*bounciness;b.dx=odx*bounciness;b.dy=ody*bounciness;lastCollisions.set(key,now);collisions++;const impact=Math.hypot(a.dx-b.dx,a.dy-b.dy);playNormal(.65+Math.min(1.5,impact/8));explosion(x,y,Math.min(2.5,.7+impact/5));a.element.style.transform='scaleX(1.18) scaleY(.84)';b.element.style.transform='scaleX(1.18) scaleY(.84)';setTimeout(()=>{a.element.style.transform='';b.element.style.transform=''},100)}
function trail(b){if(!trailsOn)return;const t=document.createElement('div');t.className='speed-trail';t.style.left=(b.x+34)+'px';t.style.top=(b.y+34)+'px';t.style.background=getComputedStyle(b.element).background;document.body.appendChild(t);setTimeout(()=>t.remove(),350)}
function move(){const maxX=Math.max(0,innerWidth-size),maxY=Math.max(0,innerHeight-size),dt=globalSpeed*(chaos?1.35:1);for(const b of balls){if(gravity)b.dy+=.035*dt;b.x+=b.dx*dt;b.y+=b.dy*dt;let hitX=false,hitY=false;if(b.x<=0||b.x>=maxX){b.x=Math.max(0,Math.min(b.x,maxX));b.dx*=-bounciness;hitX=true}if(b.y<=0||b.y>=maxY){b.y=Math.max(0,Math.min(b.y,maxY));b.dy*=-bounciness;hitY=true}if(hitX)edgeEffects(b,b.dx>0?1:-1,0,Math.abs(b.dx));if(hitY)edgeEffects(b,0,b.dy>0?1:-1,Math.abs(b.dy));if(Math.hypot(b.dx,b.dy)>6)trail(b)}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)handleCollision(balls[i],balls[j]);for(const b of balls){b.element.style.left=b.x+'px';b.element.style.top=b.y+'px'}updateStats();requestAnimationFrame(move)}
function updateStats(){const secs=Math.floor((performance.now()-startTime)/1000),m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');const fastest=Math.max(...balls.map(b=>Math.hypot(b.dx,b.dy))).toFixed(1);document.getElementById('stats').innerHTML=`<b>Balls:</b> 7<br><b>Collisions:</b> ${collisions}<br><b>Wall bounces:</b> ${wallBounces}<br><b>Fastest:</b> ${fastest} px/frame<br><b>Time alive:</b> ${m}:${s}`}
const speed=document.getElementById('speed'),bounce=document.getElementById('bounce'),vol=document.getElementById('volume');speed.oninput=()=>{globalSpeed=+speed.value;document.getElementById('speedValue').textContent=globalSpeed.toFixed(1)+'x'};bounce.oninput=()=>{bounciness=+bounce.value;document.getElementById('bounceValue').textContent=bounciness.toFixed(1)+'x'};vol.oninput=()=>{volume=+vol.value;document.getElementById('volumeValue').textContent=Math.round(volume*100)+'%';collisionSound.volume=volume};
document.getElementById('gravity').onclick=e=>{gravity=!gravity;e.target.textContent=`Gravity: ${gravity?'ON':'OFF'}`;e.target.className=gravity?'on':''};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=`Sound: ${soundOn?'ON':'OFF'}`;e.target.className=soundOn?'on':''};document.getElementById('trails').onclick=e=>{trailsOn=!trailsOn;e.target.textContent=`Trails: ${trailsOn?'ON':'OFF'}`;e.target.className=trailsOn?'on':''};document.getElementById('chaos').onclick=e=>{chaos=!chaos;e.textContent=chaos?'CHAOS MODE: ON':'CHAOS MODE';e.style.background=chaos?'#e00000':'#9b24d6';if(chaos){balls.forEach(b=>{b.dx*=1.6;b.dy*=1.6});confettiBurst(innerWidth/2,innerHeight/2,0,0,100);explosion(innerWidth/2,innerHeight/2,3)}};
move();
</script>
</body>
</html>
