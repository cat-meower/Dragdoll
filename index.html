<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Sphere</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: white; }
    .sphere {
      position: absolute; top: 24px; left: 24px; width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ff7777 0%, #e00000 42%, #8b0000 100%);
      box-shadow: 6px 8px 14px rgba(0, 0, 0, 0.25); z-index: 2;
    }
    .eye { position: absolute; top: 30px; width: 12px; height: 16px; background: #111; border-radius: 50%; }
    .eye.left { left: 28px; } .eye.right { right: 28px; }
    .mouth { position: absolute; left: 30px; top: 51px; width: 40px; height: 20px; border-bottom: 5px solid #111; border-radius: 0 0 50% 50%; }
    .confetti {
      position: fixed; width: 7px; height: 12px; pointer-events: none; z-index: 1;
      animation: confetti-fly 900ms cubic-bezier(.15,.7,.3,1) forwards;
    }
    @keyframes confetti-fly {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rotation)) scale(.7); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="sphere" aria-label="Smiling red sphere">
    <div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
  </div>
  <script>
    const sphere = document.querySelector('.sphere');
    const size = 100;
    let x = Math.random() * Math.max(0, window.innerWidth - size);
    let y = Math.random() * Math.max(0, window.innerHeight - size);
    let dx = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 1.5);
    let dy = (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 1.5);
    sphere.style.left = x + 'px'; sphere.style.top = y + 'px';

    function confettiBurst(edgeX, edgeY, directionX, directionY) {
      const colors = ['#ff0000','#00aaff','#ffd400','#22bb55','#aa44ff','#ff66aa','#ff7a00','#00dddd','#ff33cc'];
      const count = 90;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = edgeX + 'px'; piece.style.top = edgeY + 'px';
        const angle = Math.random() * Math.PI * 2;
        const distance = 70 + Math.random() * 190;
        let finalX = Math.cos(angle) * distance;
        let finalY = Math.sin(angle) * distance;
        if (directionX !== 0) finalX = directionX * (50 + Math.random() * 180);
        if (directionY !== 0) finalY = directionY * (50 + Math.random() * 180);
        piece.style.setProperty('--dx', finalX + 'px');
        piece.style.setProperty('--dy', finalY + 'px');
        piece.style.setProperty('--rotation', (Math.random() * 1440 - 720) + 'deg');
        piece.style.width = (4 + Math.random() * 6) + 'px';
        piece.style.height = (7 + Math.random() * 10) + 'px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 950);
      }
    }

    function moveSphere() {
      const maxX = Math.max(0, window.innerWidth - size);
      const maxY = Math.max(0, window.innerHeight - size);
      x += dx; y += dy;
      if (x <= 0 || x >= maxX) {
        x = Math.max(0, Math.min(x, maxX)); dx *= -1;
        confettiBurst(x + size / 2, y + size / 2, dx > 0 ? 1 : -1, 0);
      }
      if (y <= 0 || y >= maxY) {
        y = Math.max(0, Math.min(y, maxY)); dy *= -1;
        confettiBurst(x + size / 2, y + size / 2, 0, dy > 0 ? 1 : -1);
      }
      sphere.style.left = x + 'px'; sphere.style.top = y + 'px';
      requestAnimationFrame(moveSphere);
    }
    moveSphere();
  </script>
</body>
</html>
