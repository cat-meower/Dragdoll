<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Sphere</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: white;
    }

    .sphere {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ff7777 0%, #e00000 42%, #8b0000 100%);
      box-shadow: 6px 8px 14px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div class="sphere" aria-label="Red sphere"></div>
</body>
</html>
