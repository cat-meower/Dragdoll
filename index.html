<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dragdoll</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;font-family:"Comic Sans MS","Comic Sans",cursive}.sphere{position:absolute;width:110px;height:110px;border-radius:50%;box-shadow:2px 3px 0 rgba(0,0,0,.18);z-index:2}.red{background:#e00000}.orange{background:#ff8c00}.yellow{background:#ffd400}.green{background:#22bb55}.blue{background:#0066dd}.indigo{background:#5146d8}.pink{background:#ff66aa}.eye{position:absolute;top:33px;width:13px;height:17px;background:#111;border-radius:50%}.eye.left{left:32px}.eye.right{right:32px}.mouth{position:absolute;left:37px;width:36px;height:20px}.smile-big{top:50px;border-bottom:8px solid #111;border-radius:0 0 50% 50%}.smile{top:54px;border-bottom:6px solid #111;border-radius:0 0 50% 50%}.smile-small{top:57px;border-bottom:5px solid #111;border-radius:0 0 50% 50%}#title-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none}#title{margin:0 0 22px;font-size:clamp(56px,10vw,110px);font-weight:900;letter-spacing:-5px;color:#25d34f;-webkit-text-stroke:6px #111;paint-order:stroke fill;text-shadow:0 8px 0 #159b36,0 12px 24px rgba(0,0,0,.22)}#play{pointer-events:auto;border:4px solid #111;border-radius:16px;padding:15px 58px;font-size:25px;font-weight:800;color:#fff;background:#25d34f;box-shadow:0 7px 0 #111,0 12px 28px rgba(37,211,79,.3);cursor:pointer;transition:transform .12s,box-shadow .12s}#play:hover{transform:translateY(-2px);box-shadow:0 9px 0 #111,0 15px 32px rgba(37,211,79,.35)}#play:active{transform:translateY(5px);box-shadow:0 2px 0 #111,0 5px 15px rgba(37,211,79,.25)}#game-screen{position:fixed;inset:0;background:#87ceeb;display:none;overflow:hidden}#game-screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:#65b84f;border-top:6px solid #4d943b;z-index:0}#ragdoll{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;user-select:none;touch-action:none}.part{position:absolute;box-sizing:border-box;will-change:transform,left,top}.head{width:40px;height:40px;background:#f4cc43;border:3px solid #b99316;border-radius:2px}.torso{width:50px;height:58px;background:#176baa;border:3px solid #124f7e}.limb{width:25px;height:50px;background:#f4cc43;border:3px solid #b99316;border-radius:2px;transform-origin:50% 0}.leg{width:25px;height:50px;background:#a5bc50;border:3px solid #718535;border-radius:2px;transform-origin:50% 0}.face-eye{width:5px;height:7px;background:#111;top:12px;border-radius:1px;position:absolute}.face-eye.left{left:9px}.face-eye.right{right:9px}.face-mouth{width:17px;height:6px;left:9px;top:24px;border-bottom:3px solid #111;border-radius:0 0 50% 50%;position:absolute}#game-screen.playing{display:block}</style>
</head><body>
<div id="balls"></div><div id="title-screen"><h1 id="title">Dragdoll</h1><button id="play">PLAY</button></div>
<div id="game-screen"><div id="ragdoll"><div class="part head" id="head"><div class="face-eye left"></div><div class="face-eye right"></div><div class="face-mouth"></div></div><div class="part torso" id="torso"></div><div class="part limb" id="armL"></div><div class="part limb" id="armR"></div><div class="part leg" id="legL"></div><div class="part leg" id="legR"></div></div></div>
<script>
const ballsContainer=document.getElementById('balls'),size=110,gap=10,ballTypes=['red','orange','yellow','green','blue','indigo','pink'];
function makeBall(type,index){const b=document.createElement('div');b.className=`sphere ${type}`;const l=document.createElement('div');l.className='eye left';const r=document.createElement('div');r.className='eye right';const m=document.createElement('div');m.className=`mouth ${{red:'smile-big',orange:'smile',yellow:'smile-small',green:'smile',blue:'smile-small',indigo:'smile',pink:'smile-big'}[type]}`;b.append(l,r,m);ballsContainer.appendChild(b);return b}
function randomPosition(pos){let x=0,y=0;for(let i=0;i<300;i++){x=Math.random()*Math.max(0,innerWidth-size);y=Math.random()*Math.max(0,innerHeight-size);if(pos.every(([a,c])=>Math.hypot(x-a,y-c)>=size+gap))return[x,y]}return[Math.max(0,Math.min(x,innerWidth-size)),Math.max(0,Math.min(y,innerHeight-size))]}
function randomVelocity(){return{dx:(Math.random()<.5?-1:1)*(2.8+Math.random()*1.8),dy:(Math.random()<.5?-1:1)*(2.2+Math.random()*1.8)}}
const balls=[],used=[];for(let i=0;i<ballTypes.length;i++){const type=ballTypes[i],element=makeBall(type,i),p=randomPosition(used),v=randomVelocity();used.push(p);balls.push({element,x:p[0],y:p[1],dx:v.dx,dy:v.dy})}
function handleCollision(a,b){const cx=(b.x+size/2)-(a.x+size/2),cy=(b.y+size/2)-(a.y+size/2),d=Math.hypot(cx,cy);if(d===0||d>=size)return;const nx=cx/d,ny=cy/d,rv=(b.dx-a.dx)*nx+(b.dy-a.dy)*ny;if(rv>=0)return;const overlap=size-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;[a.dx,b.dx]=[b.dx,a.dx];[a.dy,b.dy]=[b.dy,a.dy]}
function move(){const maxX=Math.max(0,innerWidth-size),maxY=Math.max(0,innerHeight-size);for(const b of balls){b.x+=b.dx;b.y+=b.dy;if(b.x<=0||b.x>=maxX){b.x=Math.max(0,Math.min(b.x,maxX));b.dx*=-1}if(b.y<=0||b.y>=maxY){b.y=Math.max(0,Math.min(b.y,maxY));b.dy*=-1}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)handleCollision(balls[i],balls[j]);for(const b of balls){b.element.style.left=b.x+'px';b.element.style.top=b.y+'px'}requestAnimationFrame(move)}move();
const play=document.getElementById('play'),titleScreen=document.getElementById('title-screen'),gameScreen=document.getElementById('game-screen');const clickSound=new Audio('clickgame.mp3');play.addEventListener('pointerup',()=>{clickSound.currentTime=0;clickSound.play().catch(()=>{});titleScreen.remove();ballsContainer.innerHTML='';gameScreen.classList.add('playing');initRagdoll()});
const rag=document.getElementById('ragdoll'),parts={head:document.getElementById('head'),torso:document.getElementById('torso'),armL:document.getElementById('armL'),armR:document.getElementById('armR'),legL:document.getElementById('legL'),legR:document.getElementById('legR')};const TORSO_W=50,TORSO_H=58,LIMB_W=25,FLOOR_H=110;let points,grabbed=null,grabOffset={x:0,y:0},pointerVelocity={x:0,y:0},lastPointer={x:0,y:0,t:0};
function initRagdoll(){const cx=innerWidth/2,top=110,tx=cx-TORSO_W/2,ty=top+40,shoulderY=ty+7,hipY=ty+TORSO_H;points={torso:{x:tx,y:ty,px:tx,py:ty},armL:{x:tx-58,y:shoulderY,px:tx-58,py:shoulderY},armR:{x:tx+TORSO_W+58,y:shoulderY,px:tx+TORSO_W+58,py:shoulderY},legL:{x:tx+TORSO_W/4,y:hipY+50,px:tx+TORSO_W/4,py:hipY+50},legR:{x:tx+TORSO_W*3/4,y:hipY+50,px:tx+TORSO_W*3/4,py:hipY+50}};requestAnimationFrame(ragdollLoop)}
function constrainAnchor(a,b,ax,ay,bx,by,len){const A=points[a],B=points[b];let x=(B.x+bx)-(A.x+ax),y=(B.y+by)-(A.y+ay),d=Math.hypot(x,y)||1;let correction=(d-len)/d*.24;correction=Math.max(-.45,Math.min(.45,correction));x*=correction;y*=correction;A.x+=x;A.y+=y;B.x-=x;B.y-=y;A.px+=x;A.py+=y;B.px-=x;B.py-=y}
function setPart(el,x,y,angle){el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`rotate(${angle}rad)`}function edgeBounce(p,w,h){const maxX=innerWidth-w,maxY=innerHeight-FLOOR_H-h;if(p.x<0){p.x=0;p.px=p.x+(p.x-p.px)*-.65}if(p.x>maxX){p.x=maxX;p.px=p.x+(p.x-p.px)*-.65}if(p.y<0){p.y=0;p.py=p.y+(p.y-p.py)*-.65}if(p.y>maxY){p.y=maxY;p.py=p.y+(p.y-p.py)*-.65}}function limbEdgeBounce(p){const floor=innerHeight-FLOOR_H;if(p.x<0){p.x=0;p.px=p.x+(p.x-p.px)*-.65}if(p.x>innerWidth){p.x=innerWidth;p.px=p.x+(p.x-p.px)*-.65}if(p.y<0){p.y=0;p.py=p.y+(p.y-p.py)*-.65}if(p.y>floor){p.y=floor;p.py=p.y+(p.y-p.py)*-.65}}
function ragdollLoop(){const gravity=.055,damp=.997;for(const p of Object.values(points)){if(grabbed===p)continue;const vx=(p.x-p.px)*damp,vy=(p.y-p.py)*damp;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+gravity}if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y;grabbed.px=grabbed.x-pointerVelocity.x*1.8;grabbed.py=grabbed.y-pointerVelocity.y*1.8}for(let k=0;k<8;k++){constrainAnchor('torso','armL',0,7,0,0,58);constrainAnchor('torso','armR',TORSO_W,7,0,0,58);constrainAnchor('torso','legL',TORSO_W/4,TORSO_H,0,0,50);constrainAnchor('torso','legR',TORSO_W*3/4,TORSO_H,0,0,50);if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}}if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}edgeBounce(points.torso,TORSO_W,TORSO_H);limbEdgeBounce(points.armL);limbEdgeBounce(points.armR);limbEdgeBounce(points.legL);limbEdgeBounce(points.legR);if(grabbed){grabbed.x=lastPointer.x-grabOffset.x;grabbed.y=lastPointer.y-grabOffset.y}const T=points.torso;setPart(parts.torso,T.x,T.y,0);setPart(parts.head,T.x+5,T.y-40,0);const shoulderL={x:T.x,y:T.y+7},shoulderR={x:T.x+TORSO_W,y:T.y+7},hipL={x:T.x+TORSO_W/4,y:T.y+TORSO_H},hipR={x:T.x+TORSO_W*3/4,y:T.y+TORSO_H},AL=points.armL,AR=points.armR,LL=points.legL,LR=points.legR;setPart(parts.armL,shoulderL.x-LIMB_W/2,shoulderL.y,Math.atan2(AL.y-shoulderL.y,AL.x-shoulderL.x)-Math.PI/2);setPart(parts.armR,shoulderR.x-LIMB_W/2,shoulderR.y,Math.atan2(AR.y-shoulderR.y,AR.x-shoulderR.x)-Math.PI/2);setPart(parts.legL,hipL.x-LIMB_W/2,hipL.y,Math.atan2(LL.y-hipL.y,LL.x-hipL.x)-Math.PI/2);setPart(parts.legR,hipR.x-LIMB_W/2,hipR.y,Math.atan2(LR.y-hipR.y,LR.x-hipR.x)-Math.PI/2);requestAnimationFrame(ragdollLoop)}
function pointerPos(e){return{x:e.clientX,y:e.clientY}}rag.addEventListener('pointerdown',e=>{const q=pointerPos(e);let best=null,bd=65;for(const p of Object.values(points)){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best=p}}if(best){grabbed=best;grabOffset={x:q.x-best.x,y:q.y-best.y};pointerVelocity={x:0,y:0};lastPointer={x:q.x,y:q.y,t:performance.now()};rag.setPointerCapture(e.pointerId)}});rag.addEventListener('pointermove',e=>{if(!grabbed)return;const q=pointerPos(e),now=performance.now(),dt=Math.max(8,now-lastPointer.t);pointerVelocity.x=(q.x-lastPointer.x)/(dt/16.67);pointerVelocity.y=(q.y-lastPointer.y)/(dt/16.67);pointerVelocity.x=Math.max(-35,Math.min(35,pointerVelocity.x));pointerVelocity.y=Math.max(-35,Math.min(35,pointerVelocity.y));lastPointer={x:q.x,y:q.y,t:now}});function releaseRagdoll(){if(!grabbed)return;grabbed.px=grabbed.x-pointerVelocity.x*1.8;grabbed.py=grabbed.y-pointerVelocity.y*1.8;grabbed=null;pointerVelocity={x:0,y:0}}rag.addEventListener('pointerup',releaseRagdoll);rag.addEventListener('pointercancel',releaseRagdoll);window.addEventListener('resize',()=>{if(points)for(const p of Object.values(points)){p.x=Math.max(0,Math.min(p.x,innerWidth));p.y=Math.max(0,Math.min(p.y,innerHeight-FLOOR_H))}});
</script></body></html>
